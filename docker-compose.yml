# Manticore Search Docker Stack
# https://github.com/dillix/manticore-docker
#
# Usage:
#   Scenario A (single VPS, local only):
#     docker compose up -d
#
#   Scenario B (two VPS, public HTTPS endpoint with Caddy):
#     docker compose --profile public up -d
#
# Configuration is in the .env file; copy .env.example to .env first.

services:

  manticore:
    image: manticoresearch/manticore:25.0.0
    container_name: manticore
    restart: unless-stopped

    # Bind ports to 127.0.0.1 only — Manticore has no built-in
    # authentication, so it must never be exposed directly.
    # In Scenario B, Caddy (in the same Docker network) reaches it
    # via the internal hostname `manticore`, no host port needed.
    # In Scenario A, the local Drupal site reaches it via 127.0.0.1.
    ports:
      - "127.0.0.1:9306:9306"   # MySQL protocol (admin/debug)
      - "127.0.0.1:9308:9308"   # HTTP/JSON API (used by Drupal)

    volumes:
      - ./data:/var/lib/manticore

    # Manticore performance-tuning recommendations from the official
    # Docker Hub image documentation:
    # https://hub.docker.com/r/manticoresearch/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK

    healthcheck:
      # Probe the HTTP API on port 9308 (the same one Drupal will use).
      # The manticoresearch/manticore image ships with wget but NOT curl.
      # We hit the /cli endpoint with SHOW STATUS and discard the body;
      # wget returns a non-zero exit code on connection failure or 4xx/5xx.
      test: ["CMD-SHELL", "wget -q --post-data='SHOW STATUS' -O /dev/null http://127.0.0.1:9308/cli || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - manticore

  # Helper: generate a random password, hash it, and write the hash to .env.
  # Runs on demand only (profile=tools) — never started by `up -d`.
  #
  # Usage:
  #   docker compose run --rm generate-password
  #
  # The password is printed once to stdout in a clearly framed block;
  # you MUST save it immediately (this is the plaintext you will paste
  # into the Drupal Search API server form). The bcrypt hash is written
  # to MANTICORE_PASSWORD_HASH in .env after confirmation.
  generate-password:
    image: caddy:2-alpine
    profiles: ["tools"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/work
    working_dir: /work
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        # 1. Generate a 24-character password from a safe alphabet:
        #    [A-Za-z0-9!_.-] — copy/paste-friendly, no shell-quoting traps.
        #    /dev/urandom is the kernel CSPRNG and is suitable for secrets.
        PASSWORD=$$(tr -dc 'A-Za-z0-9!_.-' </dev/urandom | head -c 24)

        # 2. Hash it with bcrypt.
        RAW_HASH=$$(caddy hash-password --plaintext "$$PASSWORD")

        # 3. Double every '$' for Compose interpolation. When Compose
        #    loads .env to inject variables into docker-compose.yml,
        #    it processes the values themselves — every literal '$' must
        #    be escaped as '$$' or Compose will try to expand '$xyz...'
        #    as another variable and corrupt the hash.
        ESCAPED_HASH=$$(echo "$$RAW_HASH" | sed 's/[$$]/$$$$/g')
        NEW_LINE="MANTICORE_PASSWORD_HASH=$$ESCAPED_HASH"

        # 4. Show the plaintext password.
        echo ""
        echo "============================================================"
        echo "  PASSWORD (save this NOW — it will not be shown again):"
        echo ""
        echo "      $$PASSWORD"
        echo ""
        echo "============================================================"
        echo ""

        # 5. Ensure .env exists.
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            cp .env.example .env
            echo ".env was missing — created from .env.example."
          else
            : > .env
            echo ".env was missing — created empty."
          fi
        fi

        # 6. Show the planned change.
        if grep -q '^MANTICORE_PASSWORD_HASH=' .env; then
          OLD_LINE=$$(grep '^MANTICORE_PASSWORD_HASH=' .env || true)
          echo "Existing line in .env will be REPLACED:"
          echo "  - $$OLD_LINE"
          echo "  + $$NEW_LINE"
        else
          echo "Will append to .env:"
          echo "  + $$NEW_LINE"
        fi
        echo ""

        # 7. Confirm.
        printf "Apply this change? [y/N] "
        read CONFIRM
        case "$$CONFIRM" in
          y|Y|yes|YES) ;;
          *) echo "Aborted. .env was not modified."; exit 0 ;;
        esac

        # 8. Apply.
        if grep -q '^MANTICORE_PASSWORD_HASH=' .env; then
          sed -i "s|^MANTICORE_PASSWORD_HASH=.*|$$NEW_LINE|" .env
        else
          printf '%s\n' "$$NEW_LINE" >> .env
        fi
        chown "$$HOST_UID:$$HOST_GID" .env

        echo ".env updated."

        # 9. Sanity-check that MANTICORE_USERNAME is set; warn if not.
        if ! grep -qE '^MANTICORE_USERNAME=.+' .env; then
          echo ""
          echo "WARNING: MANTICORE_USERNAME is not set in .env."
          echo "Set it before starting Caddy, for example:"
          echo "  sed -i 's|^MANTICORE_USERNAME=.*|MANTICORE_USERNAME=drupal|' .env"
        fi
      - "generate-password"

  # Helper: hash a user-supplied password and write it to .env.
  # Runs on demand only (profile=tools) — never started by `up -d`.
  #
  # Usage:
  #   docker compose run --rm change-password 'your-password'
  #
  # IMPORTANT: always wrap the password in single quotes on the host
  # shell. Otherwise characters like $, !, & may be interpreted before
  # they reach the container.
  change-password:
    image: caddy:2-alpine
    profiles: ["tools"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/work
    working_dir: /work
    # The shell script is in `entrypoint`, not `command`, because
    # `docker compose run --rm change-password 'pwd'` REPLACES `command`
    # entirely with the user's arguments. Putting the script in
    # `entrypoint` keeps it intact and lets the user-supplied password
    # land in $$1 (the placeholder "change-password" below becomes $$0).
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        PASSWORD="$${1:-}"
        if [ -z "$$PASSWORD" ]; then
          echo "Error: no password supplied." >&2
          echo "" >&2
          echo "Usage:" >&2
          echo "  docker compose run --rm change-password 'your-password'" >&2
          echo "" >&2
          echo "Wrap the password in single quotes to avoid shell expansion." >&2
          exit 1
        fi

        # 1. Hash with bcrypt.
        RAW_HASH=$$(caddy hash-password --plaintext "$$PASSWORD")

        # 2. Double every '$' for Compose interpolation. When Compose
        #    loads .env to inject variables into docker-compose.yml,
        #    it processes the values themselves — every literal '$' must
        #    be escaped as '$$' or Compose will try to expand '$xyz...'
        #    as another variable and corrupt the hash.
        ESCAPED_HASH=$$(echo "$$RAW_HASH" | sed 's/[$$]/$$$$/g')
        NEW_LINE="MANTICORE_PASSWORD_HASH=$$ESCAPED_HASH"

        # 3. Ensure .env exists.
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            cp .env.example .env
            echo ".env was missing — created from .env.example."
          else
            : > .env
            echo ".env was missing — created empty."
          fi
        fi

        # 4. Show the planned change.
        echo ""
        if grep -q '^MANTICORE_PASSWORD_HASH=' .env; then
          OLD_LINE=$$(grep '^MANTICORE_PASSWORD_HASH=' .env || true)
          echo "Existing line in .env will be REPLACED:"
          echo "  - $$OLD_LINE"
          echo "  + $$NEW_LINE"
        else
          echo "Will append to .env:"
          echo "  + $$NEW_LINE"
        fi
        echo ""

        # 5. Confirm.
        printf "Apply this change? [y/N] "
        read CONFIRM
        case "$$CONFIRM" in
          y|Y|yes|YES) ;;
          *) echo "Aborted. .env was not modified."; exit 0 ;;
        esac

        # 6. Apply.
        if grep -q '^MANTICORE_PASSWORD_HASH=' .env; then
          sed -i "s|^MANTICORE_PASSWORD_HASH=.*|$$NEW_LINE|" .env
        else
          printf '%s\n' "$$NEW_LINE" >> .env
        fi
        chown "$$HOST_UID:$$HOST_GID" .env

        echo ".env updated."

        # 7. Sanity-check.
        if ! grep -qE '^MANTICORE_USERNAME=.+' .env; then
          echo ""
          echo "WARNING: MANTICORE_USERNAME is not set in .env."
          echo "Set it before starting Caddy, for example:"
          echo "  sed -i 's|^MANTICORE_USERNAME=.*|MANTICORE_USERNAME=drupal|' .env"
        fi
      - "change-password"

  caddy:
    image: caddy:2-alpine
    container_name: manticore-caddy
    restart: unless-stopped
    profiles: ["public"]

    ports:
      - "80:80"
      - "443:443"

    environment:
      MANTICORE_DOMAIN: ${MANTICORE_DOMAIN:-}
      MANTICORE_ACME_EMAIL: ${MANTICORE_ACME_EMAIL:-}
      MANTICORE_USERNAME: ${MANTICORE_USERNAME:-}
      MANTICORE_PASSWORD_HASH: ${MANTICORE_PASSWORD_HASH:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      manticore:
        condition: service_healthy

    networks:
      - manticore

networks:
  manticore:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
