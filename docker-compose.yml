# Manticore Search Docker Stack
# https://github.com/dillix/manticore-docker
#
# Usage:
#   Scenario A (single VPS — local Drupal, or reachable via your own
#               existing reverse proxy with TLS+auth):
#     docker compose up -d
#
#   Scenario B (dedicated Manticore VPS with bundled Caddy reverse proxy
#               providing TLS automatically):
#     docker compose --profile public up -d
#
# Authentication is enforced by the Manticore engine itself in both
# scenarios — see `searchd_auth` below. Run `./config setup` after the
# first `up -d` to create the admin and the application user.
#
# Configuration is in the .env file; copy .env.example to .env first.

services:

  manticore:
    image: manticoresearch/manticore:27.1.5
    container_name: manticore
    restart: unless-stopped

    # Server options applied via Manticore's Docker env-var convention
    # (the official image maps any `searchd_<name>` env to the
    # corresponding `<name>` directive in the [searchd] config section).
    #
    # searchd_not_terms_only_allowed=1 enables fulltext queries that
    # contain only negative (NOT) terms — required by the
    # search_api_manticore Drupal module
    # (https://www.drupal.org/project/search_api_manticore) for its
    # negation features. The option only relaxes a parser constraint;
    # it has no performance impact when the feature isn't used.
    #
    # searchd_auth=1 turns on Manticore's built-in authentication, which
    # maps to `auth = 1` in the generated config. Every request on both
    # the HTTP and MySQL protocols then needs credentials: a username and
    # password (HTTP Basic or MySQL) or a bearer token. Until an admin is
    # bootstrapped the daemon answers everything with 401 — tables load
    # and are intact, they are simply inaccessible. `./config setup`
    # bootstraps the admin and creates the application user.
    environment:
      searchd_not_terms_only_allowed: 1
      searchd_auth: 1

    # Bind ports to 127.0.0.1 only. The engine authenticates natively, so
    # this is defence in depth rather than the only barrier — but it keeps
    # the daemon off the public internet, which is worth having anyway.
    # In Scenario B, Caddy (in the same Docker network) reaches it
    # via the internal hostname `manticore`, no host port needed.
    # In Scenario A, the local Drupal site reaches it via 127.0.0.1.
    ports:
      - "127.0.0.1:9306:9306"   # MySQL protocol (admin/debug)
      - "127.0.0.1:9308:9308"   # HTTP/JSON API (used by Drupal)

    volumes:
      # Named volume managed by Docker. Stored under
      # /var/lib/docker/volumes/manticore-docker_manticore-data on the host
      # (the exact path depends on the Docker storage driver). Using a
      # named volume instead of a bind mount avoids the UID-mismatch
      # cosmetic issue where files in a host-mounted ./data directory
      # appear to be owned by whatever host user happens to share the
      # 999 UID with the in-container `manticore` user.
      #
      # To inspect the data path on the host:
      #   docker volume inspect manticore-docker_manticore-data
      #
      # For backup/restore procedures, see the README.
      - manticore-data:/var/lib/manticore

    # Manticore performance-tuning recommendations from the official
    # Docker Hub image documentation:
    # https://hub.docker.com/r/manticoresearch/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK

    healthcheck:
      # Probe the HTTP API on port 9308 (the same one Drupal will use).
      # The manticoresearch/manticore image ships with wget but NOT curl.
      #
      # An anonymous probe is DELIBERATE, and so is accepting wget exit 6.
      # With auth on, every endpoint answers an unauthenticated request with
      # HTTP 401, and wget exits 6 on 401 — which still proves the daemon is
      # alive and serving. Do NOT "tighten" this to exit 0 only: between
      # `up -d` and the operator finishing `./config setup` there is no admin
      # yet, so 401 is the only answer the daemon can give. Marking the
      # container unhealthy in that window makes `depends_on:
      # condition: service_healthy` below block Caddy from ever starting,
      # which wedges the whole stack on every fresh install.
      #
      # A dead daemon still fails correctly: wget exits 4 when nothing is
      # listening and 8 on a server error, neither of which is accepted.
      #
      # The endpoint is /sql?mode=raw rather than /cli because /cli is
      # served through Buddy while /sql is served by searchd directly. A
      # slow Buddy start could otherwise flap this probe, and it needs
      # nothing Buddy provides.
      test: ["CMD-SHELL", "wget -q --post-data='SHOW STATUS' -O /dev/null 'http://127.0.0.1:9308/sql?mode=raw'; ec=$$?; [ $$ec -eq 0 ] || [ $$ec -eq 6 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      # `start_interval` is deliberately NOT set here. It would make the
      # first probe land in seconds instead of at the first 30s interval,
      # which matters because `./config setup` blocks on `up -d --wait` —
      # but the healthcheck block rejects unknown keys, so any Compose whose
      # schema predates that field (added to the spec in 2023) fails
      # validation and refuses to start the stack at all. A stack that will
      # not start is a far worse failure than a slow first probe. Docker
      # Engine 25+ already defaults it to 5s when start_period is set; on
      # older engines the wizard says what it is waiting for instead.

    networks:
      - manticore

  # Configuration helper: a single entrypoint with subcommands for
  # managing .env and the engine's own users, tokens and grants. The shell
  # logic lives in bin/config.sh, which is executed via
  # `sh /work/bin/config.sh` — no executable bit (+x) on the host required.
  #
  # The image is the same pinned Manticore tag as the daemon, so it is
  # already present on any host running this stack and ships everything
  # the script needs: GNU wget (not busybox — `--header` works), sed, awk
  # and base64. It joins the `manticore` network so it can reach the
  # daemon by service name.
  #
  # Runs on demand only (profile=tools) — never started by `up -d`.
  #
  # Always invoke it through the host-side wrapper, which does the parts
  # that cannot be done from inside a container (the admin bootstrap):
  #   ./config <subcommand> [args...]
  #
  # Examples:
  #   ./config setup                   # first-time wizard
  #   ./config show                    # .env plus the engine's users
  #   ./config check                   # authenticated query against the engine
  #   ./config domain search.example.com
  #   ./config email admin@example.com
  #   ./config username drupal
  #   ./config password change         # interactive — never accepts the
  #                                    # password as a CLI argument
  #   ./config token rotate            # new MANTICORE_ADMIN_TOKEN
  #   ./config admin reset             # destructive recovery
  config:
    image: manticoresearch/manticore:27.1.5
    profiles: ["tools"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["/bin/sh", "/work/bin/config.sh"]
    networks:
      - manticore

  caddy:
    image: caddy:2.11.4-alpine
    container_name: manticore-caddy
    restart: unless-stopped
    profiles: ["public"]

    ports:
      - "80:80"
      - "443:443"

    # Only the two TLS values. Caddy no longer authenticates anything, so
    # it is deliberately given no credentials at all — the engine checks
    # them, and Caddy just forwards the Authorization header.
    environment:
      MANTICORE_DOMAIN: ${MANTICORE_DOMAIN:-}
      MANTICORE_ACME_EMAIL: ${MANTICORE_ACME_EMAIL:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      manticore:
        condition: service_healthy

    networks:
      - manticore

networks:
  manticore:
    driver: bridge

volumes:
  manticore-data:
  caddy_data:
  caddy_config:
