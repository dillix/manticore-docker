# Manticore Search Docker Stack
# https://github.com/dillix/manticore-docker
#
# Usage:
#   Scenario A (single VPS — local Drupal, or reachable via your own
#               existing reverse proxy with TLS+auth):
#     docker compose up -d
#
#   Scenario B (dedicated Manticore VPS with bundled Caddy reverse proxy
#               providing TLS + Basic Auth automatically):
#     docker compose --profile public up -d
#
# Configuration is in the .env file; copy .env.example to .env first.

services:

  manticore:
    image: manticoresearch/manticore:25.0.0
    container_name: manticore
    restart: unless-stopped

    # Server options applied via Manticore's Docker env-var convention
    # (the official image maps any `searchd_<name>` env to the
    # corresponding `<name>` directive in the [searchd] config section).
    #
    # searchd_not_terms_only_allowed=1 enables fulltext queries that
    # contain only negative (NOT) terms — required by the
    # search_api_manticore Drupal module
    # (https://www.drupal.org/project/search_api_manticore) for its
    # negation features. The option only relaxes a parser constraint;
    # it has no performance impact when the feature isn't used.
    environment:
      searchd_not_terms_only_allowed: 1

    # Bind ports to 127.0.0.1 only — Manticore has no built-in
    # authentication, so it must never be exposed directly.
    # In Scenario B, Caddy (in the same Docker network) reaches it
    # via the internal hostname `manticore`, no host port needed.
    # In Scenario A, the local Drupal site reaches it via 127.0.0.1.
    ports:
      - "127.0.0.1:9306:9306"   # MySQL protocol (admin/debug)
      - "127.0.0.1:9308:9308"   # HTTP/JSON API (used by Drupal)

    volumes:
      # Named volume managed by Docker. Stored under
      # /var/lib/docker/volumes/manticore-docker_manticore-data on the host
      # (the exact path depends on the Docker storage driver). Using a
      # named volume instead of a bind mount avoids the UID-mismatch
      # cosmetic issue where files in a host-mounted ./data directory
      # appear to be owned by whatever host user happens to share the
      # 999 UID with the in-container `manticore` user.
      #
      # To inspect the data path on the host:
      #   docker volume inspect manticore-docker_manticore-data
      #
      # For backup/restore procedures, see the README.
      - manticore-data:/var/lib/manticore

    # Manticore performance-tuning recommendations from the official
    # Docker Hub image documentation:
    # https://hub.docker.com/r/manticoresearch/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK

    healthcheck:
      # Probe the HTTP API on port 9308 (the same one Drupal will use).
      # The manticoresearch/manticore image ships with wget but NOT curl.
      # We hit the /cli endpoint with SHOW STATUS and discard the body;
      # wget returns a non-zero exit code on connection failure or 4xx/5xx.
      test: ["CMD-SHELL", "wget -q --post-data='SHOW STATUS' -O /dev/null http://127.0.0.1:9308/cli || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - manticore

  # Configuration helper: a single entrypoint with subcommands for
  # managing .env (domain, email, username, password) and running the
  # interactive setup wizard. The shell logic lives in bin/config.sh,
  # which is mounted read-only and executed via `sh /work/bin/config.sh`
  # — no executable bit (+x) on the host is required.
  #
  # Runs on demand only (profile=tools) — never started by `up -d`.
  #
  # Usage (recommended — through the host-side wrapper):
  #   ./config <subcommand> [args...]
  #
  # Examples:
  #   ./config show
  #   ./config setup
  #   ./config domain search.example.com
  #   ./config email admin@example.com
  #   ./config username drupal
  #   ./config password generate
  #   ./config password change         # interactive — never accepts the
  #                                    # password as a CLI argument
  config:
    image: caddy:2-alpine
    profiles: ["tools"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["/bin/sh", "/work/bin/config.sh"]

  caddy:
    image: caddy:2-alpine
    container_name: manticore-caddy
    restart: unless-stopped
    profiles: ["public"]

    ports:
      - "80:80"
      - "443:443"

    environment:
      MANTICORE_DOMAIN: ${MANTICORE_DOMAIN:-}
      MANTICORE_ACME_EMAIL: ${MANTICORE_ACME_EMAIL:-}
      MANTICORE_USERNAME: ${MANTICORE_USERNAME:-}
      MANTICORE_PASSWORD_HASH: ${MANTICORE_PASSWORD_HASH:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      manticore:
        condition: service_healthy

    networks:
      - manticore

networks:
  manticore:
    driver: bridge

volumes:
  manticore-data:
  caddy_data:
  caddy_config:
