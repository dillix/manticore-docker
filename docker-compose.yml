# Manticore Search Docker Stack
# https://github.com/dillix/manticore-docker
#
# Usage:
#   Scenario A (single VPS, local only):
#     docker compose up -d
#
#   Scenario B (two VPS, public HTTPS endpoint with Caddy):
#     docker compose --profile public up -d
#
# Configuration is in the .env file; copy .env.example to .env first.

services:

  manticore:
    image: manticoresearch/manticore:25.0.0
    container_name: manticore
    restart: unless-stopped

    # Bind ports to 127.0.0.1 only — Manticore has no built-in
    # authentication, so it must never be exposed directly.
    # In Scenario B, Caddy (in the same Docker network) reaches it
    # via the internal hostname `manticore`, no host port needed.
    # In Scenario A, the local Drupal site reaches it via 127.0.0.1.
    ports:
      - "127.0.0.1:9306:9306"   # MySQL protocol (admin/debug)
      - "127.0.0.1:9308:9308"   # HTTP/JSON API (used by Drupal)

    volumes:
      - ./data:/var/lib/manticore

    # Manticore performance-tuning recommendations from the official
    # Docker Hub image documentation:
    # https://hub.docker.com/r/manticoresearch/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    cap_add:
      - IPC_LOCK

    healthcheck:
      # Probe the HTTP API on port 9308 (the same one Drupal will use).
      # The manticoresearch/manticore image ships with wget but NOT curl.
      # We hit the /cli endpoint with SHOW STATUS and discard the body;
      # wget returns a non-zero exit code on connection failure or 4xx/5xx.
      test: ["CMD-SHELL", "wget -q --post-data='SHOW STATUS' -O /dev/null http://127.0.0.1:9308/cli || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - manticore

  # Configuration helper: a single entrypoint with subcommands for
  # managing .env (domain, email, username, password) and running the
  # interactive setup wizard. The shell logic lives in bin/config.sh,
  # which is mounted read-only and executed via `sh /work/bin/config.sh`
  # — no executable bit (+x) on the host is required.
  #
  # Runs on demand only (profile=tools) — never started by `up -d`.
  #
  # Usage:
  #   docker compose run --rm -it config <subcommand> [args...]
  #
  # Examples:
  #   docker compose run --rm -it config show
  #   docker compose run --rm -it config domain search.example.com
  #   docker compose run --rm -it config email admin@example.com
  #   docker compose run --rm -it config username drupal
  #   docker compose run --rm -it config password generate
  #   docker compose run --rm -it config password change 'my-password'
  #   docker compose run --rm -it config setup        (coming soon)
  config:
    image: caddy:2-alpine
    profiles: ["tools"]
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["/bin/sh", "/work/bin/config.sh"]

  caddy:
    image: caddy:2-alpine
    container_name: manticore-caddy
    restart: unless-stopped
    profiles: ["public"]

    ports:
      - "80:80"
      - "443:443"

    environment:
      MANTICORE_DOMAIN: ${MANTICORE_DOMAIN:-}
      MANTICORE_ACME_EMAIL: ${MANTICORE_ACME_EMAIL:-}
      MANTICORE_USERNAME: ${MANTICORE_USERNAME:-}
      MANTICORE_PASSWORD_HASH: ${MANTICORE_PASSWORD_HASH:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      manticore:
        condition: service_healthy

    networks:
      - manticore

networks:
  manticore:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
